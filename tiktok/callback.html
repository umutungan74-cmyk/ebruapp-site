<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ebru · TikTok</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #000; color: #F5F2EC; font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  main { width: 100%; max-width: 560px; padding: 32px 20px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 8px; font-weight: 600; }
  p { color: #8E8E93; margin: 0 0 24px; }
  .box { background: #1A1A1C; border-radius: 16px; padding: 16px; font: 13px/1.5 ui-monospace, Menlo, monospace; word-break: break-all; margin-bottom: 16px; }
  button { width: 100%; min-height: 56px; border: 0; border-radius: 999px; background: #F5F2EC; color: #000; font: 600 17px -apple-system, sans-serif; cursor: pointer; }
  .err { color: #FF453A; }
</style>
</head>
<body>
<main>
  <h1 id="title">TikTok verbunden</h1>
  <p id="lead">Kopiere die Adresse und füge sie im Terminal ein. Copy this and paste it into the terminal.</p>
  <div class="box" id="value"></div>
  <button id="copy" type="button">Kopieren</button>
</main>
<script>
// Zeigt nur an, was TikTok zurückgibt. Sendet nichts, speichert nichts.
(function () {
  var url = location.href;
  var q = new URLSearchParams(location.search);
  var box = document.getElementById('value');
  if (q.get('error')) {
    document.getElementById('title').textContent = 'Nicht verbunden';
    document.getElementById('lead').textContent = q.get('error_description') || q.get('error');
    document.getElementById('lead').className = 'err';
  } else if (!q.get('code')) {
    document.getElementById('title').textContent = 'Kein Code';
    document.getElementById('lead').textContent = 'Diese Seite wird nur nach der TikTok-Anmeldung gebraucht.';
    box.style.display = 'none';
    document.getElementById('copy').style.display = 'none';
    return;
  }
  box.textContent = url;
  // Code aus der Adressleiste und dem Verlauf nehmen, er bleibt nur hier im Speicher.
  history.replaceState(null, '', location.pathname);
  var btn = document.getElementById('copy');
  btn.addEventListener('click', function () {
    navigator.clipboard.writeText(url).then(function () { btn.textContent = 'Kopiert'; }, function () {
      var r = document.createRange(); r.selectNodeContents(box);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'Markiert, jetzt ⌘C';
    });
  });
})();
</script>
</body>
</html>
